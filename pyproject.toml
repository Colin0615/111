[project]
name = "polymarket-ai-trader"
version = "0.1.0"
description = "AI-driven Polymarket trading system"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client>=0.34.0",
    "web3==6.14.0",
    "anthropic>=0.42.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "aiosqlite>=0.20.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
polytrader = "src.main:main"
